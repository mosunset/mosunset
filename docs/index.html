<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>mosunset</title>
        <meta name="description" content="mosunset の個人用メモ（Windows セットアップ、Docsify の設定、資料作成チェックリスト）" />
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="ja_JP" />
        <meta property="og:title" content="mosunset" />
        <meta property="og:description" content="mosunset の個人用メモ（Windows セットアップ、Docsify の設定、資料作成チェックリスト）" />
        <meta property="og:url" content="https://mosunset.github.io/mosunset/" />
        <meta property="og:image" content="https://mosunset.github.io/mosunset/logo.webp" />
        <meta name="twitter:card" content="summary" />
        <link rel="icon" href="logo.webp" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" />
        <style>
            .app-name-link img {
                width: 80px;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script>
            window.$docsify = {
                name: "mosunset",
                logo: "logo.webp",
                repo: "mosunset/mosunset",
                homepage: "windows-setup/setup-guide.md",
                loadSidebar: true,
                maxLevel: 4,
                subMaxLevel: 2,
                auto2top: true,
                notFoundPage: true,
                externalLinkTarget: "_blank",
                externalLinkRel: "noopener noreferrer",
                search: {
                    paths: "auto",
                    depth: 3,
                    placeholder: "検索",
                    noData: "見つかりませんでした",
                },
                copyCode: {
                    buttonText: "コピー",
                    errorText: "エラー",
                    successText: "コピーしました",
                },
                pagination: {
                    previousText: "前のページ",
                    nextText: "次のページ",
                    crossChapter: true,
                    crossChapterText: true,
                },
                markdown: {
                    renderer: {
                        // ```mermaid のコードブロックを図にする
                        code({ text, lang }) {
                            if (lang === "mermaid") {
                                return `<div class="mermaid">${text}</div>`;
                            }
                            return this.origin.code.apply(this, arguments);
                        },
                    },
                },
                plugins: [
                    function (hook, vm) {
                        // 記事の最後に「GitHub で編集」のリンクを付ける
                        hook.beforeEach(function (markdown) {
                            const url = "https://github.com/mosunset/mosunset/blob/main/docs/" + vm.route.file;
                            return markdown + "\n\n---\n\n[GitHub で編集](" + url + ")\n";
                        });
                        hook.doneEach(function () {
                            mermaid.run();
                        });
                    },
                ],
            };
        </script>

        <!-- docsify 本体と公式プラグイン -->
        <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>

        <!-- サードパーティのプラグイン -->
        <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

        <!-- mermaid -->
        <script src="https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.min.js"></script>
        <script>
            mermaid.initialize({ startOnLoad: false });
        </script>

        <!-- コードハイライト（記事で使っている言語） -->
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
    </body>
</html>
