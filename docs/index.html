<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>mosunset</title>
        <meta name="description" content="mosunset" />
        <meta property="og:title" content="mosunset" />
        <meta property="og:description" content="mosunset" />
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="ja_JP" />
        <meta property="og:image" content="logo.webp" />
        <meta property="og:image:alt" content="mosunset | ロゴ" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="mosunset" />
        <meta name="twitter:description" content="mosunset" />
        <meta name="twitter:image" content="logo.webp" />
        <meta name="twitter:image:alt" content="mosunset | ロゴ" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
        />
        <link
            rel="stylesheet"
            href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
        />
        <link
            rel="stylesheet"
            href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css"
        />
        <link rel="icon" href="logo.webp" />
        <style>
            :root {
                --scroll-padding-top: 100px;
            }
        </style>
    </head>
    <body>
        <div id="app">Please wait...</div>
        <script>
            let svgCounter = 0;
            window.$docsify = {
                // logo: 'logo.webp', // nameとの排他表示になるため_sidebar.mdにlogoを設定している
                name: "mosunset",
                repo: "mosunset/mosunset",
                loadSidebar: true,
                subMaxLevel: 3,
                maxLevel: 4,
                auto2top: true,
                executeScript: true,
                formatUpdated: "{YYYY}/{MM}/{DD} {HH}:{mm}:{ss}.{fff}",
                notFoundPage: true,
                markdown: {
                    renderer: {
                        code({ text, lang }) {
                            if (lang === "mermaid") {
                                const svgName = `mermaid-svg-${svgCounter++}`;
                                const MERMAID_CONTAINER_ID = `${svgName}-container`;

                                mermaid
                                    .render(svgName, text)
                                    .then(({ svg }) => {
                                        const containerElement =
                                            document.querySelector(
                                                `#${MERMAID_CONTAINER_ID}`
                                            );
                                        if (containerElement) {
                                            containerElement.innerHTML = svg;
                                        } else {
                                            console.error(
                                                `Error: #${MERMAID_CONTAINER_ID} not found`
                                            );
                                        }
                                    })
                                    .catch((error) => console.error(error));
                                return `<div class="mermaid" id="${MERMAID_CONTAINER_ID}"></div>`;
                            }
                            return this.origin.code.apply(this, arguments);
                        },
                    },
                },
                search: {
                    maxAge: 86400000,
                    paths: "auto",
                    placeholder: "ドキュメントを検索...",
                    noData: "検索結果がありません",
                    depth: 3,
                    hideOtherSidebarContent: false,
                },
                copyCode: {
                    buttonText: "コピー",
                    errorText: "エラー",
                    successText: "コピー完了",
                },
                pagination: {
                    previousText: "← 前のページ",
                    nextText: "次のページ →",
                    crossChapter: true,
                    crossChapterText: true,
                },
                tabs: {
                    persist: true,
                    sync: true,
                    theme: "classic",
                    tabComments: true,
                    tabHeadings: true,
                },
                externalLinkRel: "noopener noreferrer nofollow",
                externalLinkTarget: "_blank",
                alias: {
                    "/.*/_sidebar.md": "/_sidebar.md",
                },
                plugins: [
                    function (hook, vm) {
                        hook.beforeEach(function (html) {
                            const url =
                                "https://github.com/mosunset/mosunset/blob/main/docs/" +
                                vm.route.file;
                            const editHtml =
                                "[ドキュメントを編集](" + url + ")\n";
                            return editHtml + html;
                        });
                    },
                ],
            };
        </script>
        <!-- Docsify v5 -->
        <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
        <script src="//cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.min.js"></script>
        <script>
            mermaid.initialize({ startOnLoad: false });
        </script>

        <!-- プラグイン -->
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/external-script.min.js"></script>

        <!-- 言語サポート -->
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
    </body>
</html>
